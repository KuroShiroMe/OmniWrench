# Prüfungen für jeden Pull Request und jeden Push auf main.
# Programmpakete und Installationsprogramme (inkl. Starttests) baut build.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Sprachdateien und Store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt
      - name: Python-Dateien kompilieren
        run: python -m compileall -q main.py omniwrench scripts tools
      - name: Sprachdateien Hauptprogramm
        run: python scripts/check_locales.py
      - name: Sprachdateien der Tools
        run: |
          rc=0
          for tool in tools/*/; do
            echo "::group::$tool"
            python scripts/check_locales.py "$tool" || rc=1
            echo "::endgroup::"
          done
          exit $rc
      - name: Store passt zu tools/ (Version erhöht, Store neu gebaut?)
        run: python scripts/check_store.py

  smoke:
    name: Starttest Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt
      - name: Starttest (Tresor, Tool-Installation, alle Sprachen, alle Tools öffnen)
        run: python scripts/smoke_test.py
      - name: KI-Bausteine (Protokolle, Verfremdung, Zugriff, Ablage, Wiki-Suche)
        run: python scripts/test_ai.py

  smoke-linux:
    name: Starttest Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Systembibliotheken für Qt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libfontconfig1 libxkbcommon0 libdbus-1-3 fonts-dejavu-core
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt
      - name: Starttest (Tresor, Linux-taugliche Tools, alle Sprachen)
        run: python scripts/smoke_test.py
      - name: Server-Favoriten (DHCP- und DNS-Tool mit Fake-Backends)
        run: python scripts/fav_check/test_favorites.py
      - name: KI-Funktionen der Tools (DHCP, DNS, NetProbe, IconForge mit Fake-Backends)
        run: |
          python -m pip install dnspython
          python scripts/ai_check/test_tool_ai.py
      - name: KI-Studio (Clank) mit Fake-Assistent
        run: python scripts/ai_check/test_studio.py
