# Baut OmniWrench.exe (PyInstaller) unter Windows und stellt den Programmordner als Artefakt bereit.
name: EXE-Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "scripts/build_exe.py"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: EXE bauen
        run: python scripts/build_exe.py --zip
      - name: EXE prüfen (eingebautes pip)
        shell: pwsh
        run: |
          $p = Start-Process dist\OmniWrench\OmniWrench.exe -ArgumentList '--pip','--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "OmniWrench.exe --pip --version: Exitcode $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: OmniWrench-win64
          path: dist/OmniWrench-*-win64.zip
          if-no-files-found: error
