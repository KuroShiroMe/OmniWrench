# Prüft die Tools bei jedem Pull Request und baut den Store bei jedem Push auf main.
# Gebaut werden nur Tools mit neuer Version; eine Änderung ohne Versionserhöhung schlägt fehl.
name: Store

on:
  push:
    branches: [main]
    paths: ["tools/**", "scripts/store.py", ".github/workflows/store.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/checkout@v4
        with:
          repository: KuroShiroMe/OmniWrench
          path: .omniwrench
      - name: Python-Dateien kompilieren
        run: python -m compileall -q tools scripts
      - name: Sprachdateien
        run: |
          rc=0
          for tool in tools/*/; do
            [ -f "$tool/tool.json" ] || continue
            echo "::group::$tool"
            python .omniwrench/scripts/check_locales.py "$tool" || rc=1
            echo "::endgroup::"
          done
          exit $rc
      - name: Pakete prüfen
        run: python scripts/store.py check
      - name: Store bauen und committen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [ -f .github/template-setup.json ]; then echo "Vorlage noch nicht eingerichtet."; exit 0; fi
          python scripts/store.py build
          if [ -n "$(git status --porcelain store)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add store
            git commit -m "Store neu gebaut"
            git push
          fi
